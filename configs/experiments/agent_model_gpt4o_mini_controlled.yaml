name: agent_model_gpt4o_mini_controlled
stage: agent_model_comparison
dataset: datasets/golden_set_multidoc.jsonl
chunking:
  size_words: 200
  overlap_words: 40
embedding_model: text-embedding-3-small
top_k: 10
corpus:
  sources:
    - id: ai_engineering
      title: Cast — AI Engineering Handbook
      path: docs/sources/ai_engineering.md
    - id: pedro
      title: Pedro Castanheira Costa
      path: docs/sources/pedro_castanheira.md
    - id: projects
      title: Projetos e aplicações de IA
      path: docs/sources/projects.md
agent:
  mode: controlled
  model: gpt-4o-mini
  prompt_version: shared_v1
  max_tool_calls: 5
  max_steps: 8
  tool_interface: retrieve(query, scope, k)
generation_eval:
  model: gpt-4.1-mini
  query_ids: [q001, q009, q016, q018]
retrieval_backends:
  - flat
  - filtered
  - graph
question_slices:
  - single_document
  - cross_document
  - multi_hop
cache:
  enabled: true
  root: cache
  namespaces:
    - text_embeddings
    - knowledge_graph
    - agent_runs

