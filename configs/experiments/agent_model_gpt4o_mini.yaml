name: agent_model_gpt4o_mini
stage: agent_model_comparison
dataset: datasets/golden_set_multidoc.jsonl
chunking:
  size_words: 200
  overlap_words: 40
embedding_model: text-embedding-3-small
top_k: 10
corpus:
  sources:
    - id: ai_engineering
      title: Cast — AI Engineering Handbook
      path: docs/sources/ai_engineering.md
    - id: pedro
      title: Pedro Castanheira Costa
      path: docs/sources/pedro_castanheira.md
    - id: projects
      title: Projetos e aplicações de IA
      path: docs/sources/projects.md
agent:
  mode: tuned
  model: gpt-4o-mini
  max_tool_calls: 5
  max_steps: 8
generation_eval:
  model: gpt-4.1-mini
  query_ids: [q001, q009, q016, q018]
retrieval_backends:
  - flat
  - filtered
  - graph
strategies:
  flat:
    prompt_version: flat_v1
    tools:
      - search_all
  filtered:
    prompt_version: filtered_v1
    tools:
      - search_by_document
  graph:
    prompt_version: graph_v1
    tools:
      - graph_search
      - fetch_source_chunks
query_cache_scope: agent_tuned:filtered
cache:
  enabled: true
  root: cache
  agent_run_namespace: agent_tuned
  namespaces:
    - text_embeddings
    - reranker
    - knowledge_graph
    - agent_runs
